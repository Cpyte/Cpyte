name: Cpyte CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Ubuntu
            arch: x86_64
            runner: ubuntu-24.04

          - os: Ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm

          - os: macOS
            arch: arm64
            runner: macos-14

          - os: macOS
            arch: x86_64
            runner: macos-13

          - os: Windows
            arch: x86_64
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # bignum.c (GMP) and floats_runtime.c (MPFR) are compiled and linked into
      # every program, so the native AOT builds in ci_test.py need the dev
      # headers/libs on every runner.
      - name: Install GMP/MPFR (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Install GMP/MPFR (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr

      - name: Install GMP/MPFR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install gmp:x64-windows mpfr:x64-windows
          $prefix = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "CPYTE_GMP_INCLUDE=$prefix\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CPYTE_MPFR_INCLUDE=$prefix\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run compiler API regression tests
        run: python test/test_compiler_regressions.py

      - name: Run Cpyte tests
        run: python ci_test.py

  scorpion:
    name: Scorpion ABI + dynamic linking
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install RISC-V cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: #scorpion ABI (directive, semantic, LLVM layout, runtime, LSP)
        run: python test/test_scorpion_abi.py

      - name: Scorpion dynamic linking (SEF export/import)
        run: python test/test_scorpion_dl.py

  bomb:
    name: Bomb test (2500 crash reproducers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install GMP/MPFR (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Compile every historical crash reproducer
        run: python ci_bomb.py

  benchmarks:
    name: Benchmarks (C vs cpy vs Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install GMP/MPFR (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Run benchmarks
        run: python benchmarks/run_benchmarks.py
