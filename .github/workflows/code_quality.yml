name: Cpyte CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Ubuntu
            arch: x86_64
            runner: ubuntu-24.04

          - os: Ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm

          - os: macOS
            arch: arm64
            runner: macos-14

          # Deliberately no macOS x86_64 leg. llvmlite has shipped no mac
          # Intel wheel since 0.45.1 (and that one only up to Python 3.13), so
          # `pip install -r requirements.txt` falls back to a source build and
          # fails; pinning 0.45.1 (LLVM 20) instead is no better, because
          # modern Apple clang emits LLVM-21-only IR attributes
          # (nocreateundeforpoison) that LLVM 20 cannot parse, which kills the
          # JIT. GitHub also retires the Intel images in Aug 2027. arm64 above
          # is the supported macOS target.

          - os: Windows
            arch: x86_64
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # bignum.c (GMP) and floats_runtime.c (MPFR) are compiled and linked into
      # every program, so the native AOT builds in ci_test.py need the dev
      # headers/libs on every runner.
      - name: Install GMP/MPFR (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Install GMP/MPFR (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr

      # vcpkg builds gmp/mpfr from source, which costs ~20 min on a cold runner.
      # Persist its file-based binary cache across runs so later runs restore
      # the prebuilt archives instead of recompiling. (The `x-gha` backend that
      # used to write to the Actions cache directly was removed from vcpkg in
      # 2025, so the directory has to be carried by actions/cache instead.)
      # VCPKG_DEFAULT_BINARY_CACHE must point at the cached dir and exist
      # before vcpkg runs, or it silently falls back to its default cache.
      - name: Cache vcpkg binary packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-windows-x64-gmp-mpfr-v1

      - name: Install GMP/MPFR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg install gmp:x64-windows mpfr:x64-windows
          $prefix = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "CPYTE_GMP_INCLUDE=$prefix\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CPYTE_MPFR_INCLUDE=$prefix\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run compiler API regression tests
        run: python test/test_compiler_regressions.py

      - name: Run Cpyte tests
        run: python ci_test.py

  scorpion:
    name: Scorpion ABI + dynamic linking
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install RISC-V cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: #scorpion ABI (directive, semantic, LLVM layout, runtime, LSP)
        run: python test/test_scorpion_abi.py

      - name: Scorpion dynamic linking (SEF export/import)
        run: python test/test_scorpion_dl.py

  bomb:
    name: Bomb test (2500 crash reproducers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install GMP/MPFR (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Compile every historical crash reproducer
        run: python ci_bomb.py

  benchmarks:
    name: Benchmarks (C vs cpy vs Python)
    # Keep untrusted pull-request code off the private benchmark runner.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[benchmark-results]')
    runs-on: [self-hosted, cpyte-official-runner-1]
    timeout-minutes: 30
    concurrency:
      group: cpyte-benchmark-results-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install GMP/MPFR/CLANG (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev clang

      - name: Run benchmarks
        run: python benchmarks/run_benchmarks.py --json "${{ runner.temp }}/benchmark-results.json"

      - name: Update README benchmark table
        run: >-
          python benchmarks/update_readme_benchmarks.py
          "${{ runner.temp }}/benchmark-results.json"
          --commit "${{ github.sha }}"
          --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Push updated benchmark table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md
          if git diff --cached --quiet; then
            echo "Benchmark table is unchanged."
            exit 0
          fi
          git commit -m "Update CI benchmark results [benchmark-results]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
